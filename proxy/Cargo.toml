[package]
name = "astragraph-proxy"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "process"] }
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["metrics", "rt-tokio"] }
astragraph-proto = { path = "../proto" }
prost-types = "0.12"
tonic = { version = "0.11", features = ["tls"] }
tokio-stream = "0.1"
toml = "0.9.11"
axum = "0.8.8"
reqwest = { version = "0.13.1", features = ["json", "stream", "rustls-native-certs"] }
opentelemetry-otlp = { version = "0.31", features = ["trace", "metrics", "grpc-tonic"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
tracing-opentelemetry = "0.32.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }