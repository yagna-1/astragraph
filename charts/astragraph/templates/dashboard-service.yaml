apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-dashboard
  labels:
    app: {{ .Release.Name }}-dashboard
spec:
  type: ClusterIP
  selector:
    app: {{ .Release.Name }}-dashboard
  ports:
    - port: {{ .Values.dashboard.servicePort }}
      targetPort: {{ .Values.dashboard.servicePort }}
