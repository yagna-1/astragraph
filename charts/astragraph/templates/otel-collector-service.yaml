apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-otel-collector
  labels:
    app: {{ .Release.Name }}-otel-collector
spec:
  type: ClusterIP
  selector:
    app: {{ .Release.Name }}-otel-collector
  ports:
    - name: grpc
      port: {{ .Values.otelCollector.servicePort }}
      targetPort: {{ .Values.otelCollector.servicePort }}
    - name: http
      port: 4318
      targetPort: 4318
