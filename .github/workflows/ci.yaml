name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Python dependencies
        run: pip install pytest grpcio-tools requests
      - name: Generate protobuf code
        run: make proto-gen
      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust unit tests
        run: cargo test --workspace
      - name: Policy regression packs
        run: cargo test -p astragraph-policy policy_regression_packs_pass
      - name: Python integration tests
        run: pytest tests/integration/ -v
      - name: Generate mTLS certs for E2E stack
        run: make certs
      - name: Run dockerized three-agent E2E gate
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d otel-collector graph policy verifier proxy lead-scorer proposal-writer contract-reviewer
          python3 scripts/e2e_three_agent_gate.py --timeout-secs 900 --scenario standard
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml down --remove-orphans
          ASTRAGRAPH_POLICY_ID=e2e-queue-policy docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d otel-collector graph policy verifier proxy lead-scorer proposal-writer contract-reviewer
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml stop verifier
          python3 scripts/e2e_three_agent_gate.py --timeout-secs 900 --scenario queue-fallback
      - name: Tear down dockerized E2E stack
        if: ${{ always() }}
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color || true
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v --remove-orphans || true
      - name: Start mock proxy fixture
        run: |
          python3 scripts/mock_proxy_server.py --port 7070 &
          echo $! > /tmp/mock_proxy.pid
      - name: Latency benchmark (shared-runner smoke gate)
        run: python3 benchmarks/proxy_latency.py --iterations 100 --concurrency 16 --p99-target-ms 2000 --require-success
      - name: AgentBench FAR evaluation
        run: python3 eval/agentbench_eval.py --dataset eval/agentbench.jsonl --proxy-url http://127.0.0.1:7070/mcp/tools/call --max-far 0.05 --require-inputs --strict-http
      - name: Synthetic attack evaluation gate
        run: python3 eval/synthetic_attack_eval.py --dataset tests/synthetic/attack_traces.jsonl --proxy-url http://127.0.0.1:7070/mcp/tools/call --max-fnr 0.05 --max-far 0.10 --min-malicious-recall 0.95 --min-attack-recall 0.90 --require-inputs --strict-http
      - name: Anonymized trace evaluation gate
        run: python3 eval/anonymized_trace_eval.py --dataset tests/anonymized/anonymized_traces.jsonl --proxy-url http://127.0.0.1:7070/mcp/tools/call --max-fnr 0.05 --max-fpr 0.10 --min-recall 0.95 --require-inputs --strict-http --output /tmp/anonymized_eval_summary.json
      - name: Verifier model-upgrade protocol gate
        run: python3 eval/model_upgrade_gate.py --candidate /tmp/anonymized_eval_summary.json --baseline eval/baselines/anonymized_eval_baseline.json --max-fnr-regression 0.02 --max-fpr-regression 0.02 --max-recall-regression 0.02 --min-candidate-recall 0.95
      - name: Review feedback loop summary
        run: python3 eval/review_feedback_loop.py --input tests/anonymized/review_feedback.jsonl --output /tmp/verifier_feedback_summary.json --require-inputs
      - name: Stop mock proxy fixture
        if: ${{ always() }}
        run: |
          if [ -f /tmp/mock_proxy.pid ]; then kill "$(cat /tmp/mock_proxy.pid)" || true; fi

  perf-gate:
    if: ${{ vars.ENABLE_PERF_CI == 'true' }}
    runs-on: [self-hosted, perf]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: pip install requests
      - name: Start mock proxy fixture
        run: |
          python3 scripts/mock_proxy_server.py --port 7070 &
          echo $! > /tmp/mock_proxy.pid
      - name: Latency benchmark (strict p99)
        run: python3 benchmarks/proxy_latency.py --iterations 100 --concurrency 16 --p99-target-ms 20 --require-success
      - name: Stop mock proxy fixture
        if: ${{ always() }}
        run: |
          if [ -f /tmp/mock_proxy.pid ]; then kill "$(cat /tmp/mock_proxy.pid)" || true; fi

  gpu-eval:
    if: ${{ vars.ENABLE_GPU_CI == 'true' }}
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Generate protobuf code
        run: make proto-gen
      - name: Distillation pipeline smoke test
        run: python verifier/distillation/train.py --data-dir /tmp/ag-data --output-dir /tmp/ag-artifacts
      - name: Start mock proxy fixture
        run: |
          python3 scripts/mock_proxy_server.py --port 7070 &
          echo $! > /tmp/mock_proxy.pid
      - name: AgentBench FAR evaluation (GPU path)
        run: python3 eval/agentbench_eval.py --dataset eval/agentbench.jsonl --proxy-url http://127.0.0.1:7070/mcp/tools/call --max-far 0.05 --require-inputs --strict-http
      - name: Stop mock proxy fixture
        if: ${{ always() }}
        run: |
          if [ -f /tmp/mock_proxy.pid ]; then kill "$(cat /tmp/mock_proxy.pid)" || true; fi
